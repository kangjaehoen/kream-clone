<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <title>관리자 | 관심 키워드 관리</title>
    <style>
        .admin-wrap{max-width:1120px;margin:0 auto;padding:32px 40px;box-sizing:border-box}
        .admin-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
        .admin-title{font-size:20px;font-weight:700}
        .admin-sub{font-size:12px;color:rgba(34,34,34,.6);margin-top:6px}
        .flash{margin:12px 0;padding:10px 12px;border:1px solid #ebebeb;border-radius:8px;background:#fafafa;font-size:13px}
        .card{border:1px solid #ebebeb;border-radius:12px;padding:18px;background:#fff}
        .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
        .input{height:40px;padding:0 12px;border:1px solid #d3d3d3;border-radius:8px;min-width:260px;font-size:14px}
        .btn{height:40px;padding:0 14px;border-radius:8px;border:1px solid #d3d3d3;background:#fff;font-size:13px;font-weight:600;cursor:pointer}
        .btn.primary{border-color:#222;background:#222;color:#fff}
        .btn.danger{border-color:#e24949;color:#e24949;background:#fff}
        table{width:100%;border-collapse:collapse;margin-top:14px}
        th,td{padding:12px 10px;border-top:1px solid #f0f0f0;text-align:left;font-size:13px;vertical-align:middle}
        th{font-size:12px;color:rgba(34,34,34,.6);font-weight:700}
        .idcol{width:90px;color:rgba(34,34,34,.7)}
        .actcol{width:220px}
        .inline-form{display:flex;gap:8px;align-items:center}
        .muted{color:rgba(34,34,34,.6);font-size:12px}
    </style>
</head>
<body>
<main class="admin-wrap">
    <div class="admin-head">
        <div>
            <div class="admin-title">관심 키워드 관리</div>
            <div class="admin-sub">`wish_keyward` 테이블 데이터를 추가/수정/삭제(소프트 삭제)합니다.</div>
        </div>
        <a class="btn" href="/" style="text-decoration:none;display:inline-flex;align-items:center">HOME로</a>
    </div>

    <div th:if="${message}" class="flash" th:text="${message}">메시지</div>

    <div class="card">
        <div class="row">
            <form class="inline-form" th:action="@{/admin/wish-keywards}" method="post">
                <input class="input" type="text" name="wishKeywardName" placeholder="추가할 키워드명" maxlength="200" required>
                <button class="btn primary" type="submit">추가</button>
            </form>
            <div class="muted">삭제된 키워드는 메인에 노출되지 않습니다.</div>
        </div>

        <table>
            <thead>
            <tr>
                <th class="idcol">ID</th>
                <th>키워드명</th>
                <th class="actcol">관리</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(items)}">
                <td colspan="3" class="muted">등록된 키워드가 없습니다.</td>
            </tr>
            <tr th:each="item : ${items}">
                <td class="idcol" th:text="${item.wishKeywardId}">1</td>
                <td>
                    <form class="inline-form" th:action="@{|/admin/wish-keywards/${item.wishKeywardId}|}" method="post">
                        <input class="input" type="text" name="wishKeywardName" maxlength="200"
                               th:value="${item.wishKeywardName}" required>
                        <button class="btn" type="submit">수정</button>
                    </form>
                </td>
                <td class="actcol">
                    <form th:action="@{|/admin/wish-keywards/${item.wishKeywardId}/delete|}" method="post"
                          onsubmit="return confirm('정말 삭제할까요? (소프트 삭제)');">
                        <button class="btn danger" type="submit">삭제</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
